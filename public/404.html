<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>drawDB</title>
    <script>
      // Single Page Apps redirect for GitHub Pages with HashRouter
      (function () {
        var pathSegmentsToKeep = 1; // 1 for repo path: /drawdb-wk/
        var l = window.location;
        var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
        var search = l.search ? (l.search.startsWith('?') ? l.search : '?' + l.search) : '';
        var repo = l.pathname.slice(1).split('/')[0];
        var target = l.protocol + '//' + l.host + '/' + repo + '/#' + (path ? '/' + path : '') + search + l.hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
